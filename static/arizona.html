<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReVolt — Secret Zoner Analytics</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 1.25rem; border: 1px solid #334155; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 800; color: #22c55e; margin-top: 0.5rem; }
        .back-btn { display: inline-block; margin-bottom: 1rem; color: #38bdf8; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <a href="/" class="back-btn">&larr; Back to ReVolt</a>
    <h1>🌵 Arizona Tea Metrics (Secret Zoner Dashboard)</h1>
    <p>Live metrics compiled directly from <code>revolt.db</code> logs.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div>Cans Scanned</div>
            <div id="cansScanned" class="stat-value">0</div>
        </div>
        <div class="stat-card">
            <div>Total Volume</div>
            <div id="totalVolume" class="stat-value">0 fl oz</div>
        </div>
        <div class="stat-card">
            <div>Total Gallons</div>
            <div id="totalGallons" class="stat-value">0 gal</div>
        </div>
    </div>

    <script>
        async function fetchZonerStats() {
            try {
                const res = await fetch('/api/secret/arizona');
                if (!res.ok) return;
                const data = await res.json();
                
                document.getElementById('cansScanned').textContent = data.cans_scanned || 0;
                document.getElementById('totalVolume').textContent = `${data.total_fl_oz || 0} fl oz`;
                
                const gallons = ((data.total_fl_oz || 0) / 128).toFixed(2);
                document.getElementById('totalGallons').textContent = `${gallons} gal`;
                
                ### document.getElementById('sugarIntake').textContent = `${data.estimated_sugar_g || 0} g`;
            } catch (err) {
                console.error('Failed to load stats:', err);
            }
        }
        
        window.addEventListener('DOMContentLoaded', fetchZonerStats);
    </script>
</body>
</html>
